services:
  - type: web
    name: jastclone
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: KP_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true